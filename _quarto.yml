project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "**/*.qmd"
    - "!docs/"
  resources:
    - "resume/*.pdf"
    - "images/*"
    - "work/*/demo/**"
    - "CNAME"

website:
  title: "Casey Aguilar-Gervase"
  site-url: "https://caseyag.co"
  description: "Data scientist, R Shiny specialist and UI/UX designer. Data deserves apps people actually want to use."
  search: false
  open-graph:
    image: /images/social-card.png
    image-alt: "Casey Aguilar-Gervase, Data Scientist, R Shiny Specialist & UI/UX Designer"
  twitter-card:
    card-style: summary_large_image
    image: /images/social-card.png
    image-alt: "Casey Aguilar-Gervase, Data Scientist, R Shiny Specialist & UI/UX Designer"
  navbar:
    title: "caseyag"
    right:
      - text: About
        href: about/index.qmd
      - text: Work
        href: work/index.qmd
      - text: Talks
        href: talks/index.qmd
      - text: Resume
        href: resume/index.qmd
      - icon: github
        href: https://github.com/caseyag
        target: _blank
        aria-label: GitHub
      - icon: linkedin
        href: https://www.linkedin.com/in/casey-aguilar-gervase/
        target: _blank
        aria-label: LinkedIn
  page-footer:
    left: "© 2026 Casey Aguilar-Gervase"
    right:
      - text: "97caguilar@gmail.com"
        href: "mailto:97caguilar@gmail.com"
      - icon: linkedin
        href: https://www.linkedin.com/in/casey-aguilar-gervase/
        target: _blank
        aria-label: LinkedIn
      - icon: github
        href: https://github.com/caseyag
        target: _blank
        aria-label: GitHub

format:
  html:
    date-format: "MMMM YYYY"
    # Light only for now. To bring dark mode back, use
    #   theme: {light: [default, theme.scss, theme-rules.scss], dark: [default, theme-dark.scss, theme-rules.scss]}
    # and add `respect-user-color-scheme: true`.
    theme: [default, theme.scss, theme-rules.scss]
    toc: false
    link-external-newwindow: true
    link-external-filter: '^https?://(caseyag\.co|caseyag\.github\.io)'
    anchor-sections: false
    smooth-scroll: true
